    html, body { width: 900px; height: 1200px; margin: 0; overflow: hidden; }
    body {
      color: #173c3a; background: #f7f3e8; font-family: "PingFang SC", sans-serif;
      background-image: linear-gradient(rgba(23,60,58,.035) 1px, transparent 1px), linear-gradient(90deg,rgba(23,60,58,.035) 1px,transparent 1px);
      background-size: 28px 28px;
    }
    .card { position: relative; width: 100%; height: 100%; padding: 74px; overflow: hidden; }
    .card::after { content: "1"; position: absolute; right: -12px; bottom: -200px; font-family: Georgia, serif; font-size: 700px; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(23,60,58,.08); }
    .top { position: relative; z-index: 2; display: flex; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid rgba(23,60,58,.24); font-size: 13px; letter-spacing: .12em; }
    .top b { font-family: "Songti SC", serif; font-size: 21px; }
    .kicker { position: relative; z-index: 2; margin: 88px 0 17px; color: #b9543f; font-size: 11px; letter-spacing: .2em; font-weight: 700; }
    h1 { position: relative; z-index: 2; margin: 0; font-family: "Songti SC", serif; font-size: 74px; line-height: 1.1; letter-spacing: -.05em; }
    h1 span { display: block; color: transparent; -webkit-text-stroke: 1.2px #173c3a; }
    .sub { position: relative; z-index: 2; margin: 28px 0 42px; color: #5c7066; font-family: "Songti SC", serif; font-size: 22px; }
    .qr-zone { position: relative; z-index: 2; display: grid; grid-template-columns: 330px 1fr; gap: 40px; align-items: center; padding: 28px; color: #f7f3e8; background: #173c3a; }
    .qr-zone img { width: 330px; height: 330px; background: #f7f3e8; }
    .qr-zone h2 { margin: 0 0 18px; font-family: "Songti SC", serif; font-size: 36px; }
    .qr-zone p { margin: 0; color: rgba(255,255,255,.68); font-size: 13px; line-height: 1.9; word-break: break-all; }
    .qr-zone b { display: block; margin-top: 18px; color: #d7b178; font-size: 11px; letter-spacing: .08em; }
    .footer { position: relative; z-index: 2; display: flex; justify-content: space-between; margin-top: 27px; padding-top: 18px; border-top: 1px solid rgba(23,60,58,.22); color: #697a70; font-size: 11px; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><b>如皋市实验初中</b><span>全国教育科学规划项目 · 基础教育改革创新实践案例</span><span>2026</span></div>

    <p class="sub">一体三维四环 · 关键数据 · 专业成果 · 材料下载</p>
    <section class="qr-zone">
      <img src="assets/images/qr-site.png" alt="案例证据网站二维码">
      <div><h2>远程阅卷</h2><p>https://nantongdjh1966-sudo.github.io/<br>rugao-health-first-case/</p><b>BEA230076</b></div>
    </section>
    <div class="footer"><span>公开页不使用学生正脸照片<br>仅供本次案例评审使用</span><span>完整原件包经百度网盘定向共享<br>如皋市实验初中</span></div>
  </main>
</body>
